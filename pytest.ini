[pytest]
# 只把 manual/（诊断脚本）排除掉，其余自动发现。
#
# ── 为什么不用 testpaths ────────────────────────────────────────────────
# 第一版写了 `testpaths = backend/tests`，结果在项目根跑 `pytest` 时
# **只收集到 backend 的 55 条**，根目录那 379 条规则层测试全被跳过。
# 这是我没想到的：`testpaths` 是"默认搜索路径"，设了它根目录就不扫了。
#
# 现在改成：不设 testpaths，只告诉 pytest 哪些目录别进。
#
# ── 为什么 manual/ 必须排除 ─────────────────────────────────────────────
# `backend/tests/manual/` 里是诊断脚本（探测 relay、抓流式原始响应等）：
#   - 模块级就 build_llm()，需要真实 LLM_API_KEY
#   - 有的文件名以 test_ 开头，会被误收集
# 误收集的后果是整个收集阶段 ERROR，一条测试都跑不了（实测踩过）。
norecursedirs =
    backend/tests/manual
    .venv
    node_modules
    .git
    frontend
    data
    logs
    runs
    reports
    tools/__pycache__

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── 已知的良性警告不必刷屏 ──────────────────────────────────────────────
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
