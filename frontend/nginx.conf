# Nginx 配置：静态文件 + API 代理
#
# 三个关键点：
# 1. `try_files ... /index.html` —— Vue Router 的 history 模式需要
#    （否则刷新 /report/xxx 会 404）
# 2. `/api` 反代到后端容器 —— 前端代码里写相对路径，同源不会触发 CORS
# 3. SSE 的 `proxy_buffering off` —— 不关的话流式输出会被 Nginx 攒着不发

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip：JS/CSS 压缩率约 70%
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------------------------------------------------------------- API
    location /api/ {
        # ------------------------------------------------------------------
        # 用变量 + resolver 而不是直接写 `proxy_pass http://backend:8080`
        #
        # 踩过的坑：直接写主机名时，Nginx **在启动阶段**就要解析 DNS。
        # 如果 backend 容器还没起来，Nginx 直接崩溃退出：
        #     [emerg] host not found in upstream "backend"
        # 而 compose 的 depends_on 只保证"启动顺序"，不保证"应用就绪"，
        # 所以容器重建时这个竞态必然出现（实测：前端 502 + unhealthy，
        # 但 `docker exec ia-frontend wget http://backend:8080` 是通的）。
        #
        # 用变量后，Nginx 启动时不解析，**请求到来时才查 DNS**，
        # 配合 Docker 内嵌 DNS（127.0.0.11）就能容忍后端延迟启动。
        # ------------------------------------------------------------------
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8080;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 模型调用可能慢（最长 2 分钟）
        proxy_read_timeout 180s;
        proxy_connect_timeout 15s;

        # SSE 必须关缓冲，否则"流式"变"一次性"
        proxy_buffering off;
        proxy_cache off;
    }

    # ---------------------------------------------------------------- 静态资源
    # 带 hash 的文件长缓存（构建产物文件名变了浏览器会自动更新）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------------------------------------------------------------- SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全头（最小集）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
